<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOGGEX — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   HOGGEX — edit your work below in the WORK object (script tag).
   ============================================================ */
:root{
  --bg:#000000;
  --fg:#ffffff;
  --dim:#8a8a8a;
  --line:rgba(255,255,255,.16);
  --line-soft:rgba(255,255,255,.07);
  --tile:#0d0d0d;
  --max:1400px;
}
:root:not([data-theme="light"]){ color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:"Inter Tight",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  overflow-x:hidden;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:1px solid #fff;outline-offset:3px}

/* ---------- shell ---------- */
.wrap{max-width:var(--max);margin:0 auto;padding:0 clamp(20px,5vw,64px)}

.topbar{
  position:fixed;top:0;left:0;right:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:22px clamp(20px,5vw,64px);
  mix-blend-mode:difference;
}
.mark{
  font-family:"Syne",sans-serif;font-weight:800;letter-spacing:.22em;
  font-size:13px;
}
.topnav{display:flex;gap:26px;font-size:12.5px;letter-spacing:.08em;color:var(--fg)}
.topnav button{opacity:.55;transition:opacity .25s}
.topnav button:hover,.topnav button[aria-current="true"]{opacity:1}

/* ---------- view switching ---------- */
.view{display:none}
.view.is-active{display:block}

/* ---------- home ---------- */
.hero{
  padding-top:clamp(120px,18vh,210px);
  padding-bottom:clamp(40px,7vh,80px);
}
.hero h1{
  font-family:"Syne",sans-serif;
  font-weight:800;
  font-size:clamp(3.2rem,15.5vw,14rem);
  line-height:.82;
  letter-spacing:-.035em;
  margin:0;
  text-transform:uppercase;
}
.hero .caption{
  margin:clamp(22px,3.4vh,38px) 0 0;
  max-width:64ch;
  font-size:clamp(.82rem,1.45vw,1rem);
  line-height:1.75;
  color:var(--dim);
}
.hero .caption b{color:var(--fg);font-weight:400}

/* ---------- section boxes ---------- */
.boxes{
  display:grid;grid-template-columns:1fr 1fr;
  border-top:1px solid var(--line);
  margin-top:clamp(36px,6vh,70px);
}
.box{
  position:relative;
  display:block;width:100%;text-align:left;
  padding:clamp(28px,4vw,52px) clamp(22px,3vw,44px) clamp(24px,3vw,40px);
  min-height:clamp(230px,34vh,340px);
  border-left:1px solid var(--line);
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  overflow:hidden;
  transition:background .4s ease;
}
.box + .box{border-left:0}
.box:hover,.box:focus-visible{background:#0b0b0b}
.box-index{font-size:11px;letter-spacing:.2em;color:var(--dim)}
.box h2{
  font-family:"Syne",sans-serif;font-weight:700;
  font-size:clamp(1.5rem,4vw,3rem);
  line-height:1.02;margin:14px 0 0;letter-spacing:-.02em;
}
.box p{margin:12px 0 0;font-size:.85rem;line-height:1.65;color:var(--dim);max-width:34ch}
.box-foot{
  position:absolute;left:clamp(22px,3vw,44px);bottom:clamp(20px,2.6vw,34px);
  right:clamp(22px,3vw,44px);
  display:flex;align-items:center;justify-content:space-between;
  font-size:12px;letter-spacing:.06em;color:var(--dim);
}
.box .enter{
  display:inline-flex;align-items:center;gap:10px;color:var(--fg);
  transform:translateX(0);transition:transform .35s cubic-bezier(.2,.8,.2,1);
}
.box:hover .enter{transform:translateX(7px)}
.enter svg{width:20px;height:9px}

.strip{
  position:absolute;right:0;top:0;bottom:0;width:36%;
  display:grid;grid-template-rows:repeat(3,1fr);gap:1px;
  opacity:.5;transition:opacity .45s ease;
  pointer-events:none;
  -webkit-mask-image:linear-gradient(to left,#000 35%,transparent 100%);
  mask-image:linear-gradient(to left,#000 35%,transparent 100%);
}
.box:hover .strip{opacity:.95}
.strip .cell{background:var(--tile);overflow:hidden}
.strip .cell img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05)}

.footer{
  padding:clamp(40px,8vh,90px) 0 46px;
  display:flex;flex-wrap:wrap;gap:18px 34px;justify-content:space-between;
  font-size:12px;letter-spacing:.05em;color:var(--dim);
}
.footer a{border-bottom:1px solid var(--line);padding-bottom:2px}
.footer a:hover{color:var(--fg);border-color:var(--fg)}

/* ---------- gallery ---------- */
.gallery-head{
  padding-top:clamp(108px,15vh,170px);
  padding-bottom:clamp(26px,4vh,46px);
  border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 30px;justify-content:space-between;
}
.gallery-head h2{
  font-family:"Syne",sans-serif;font-weight:800;
  font-size:clamp(2rem,7.5vw,5.4rem);line-height:.9;margin:0;letter-spacing:-.03em;
  text-transform:uppercase;
}
.gallery-head .meta{font-size:12.5px;color:var(--dim);letter-spacing:.06em;padding-bottom:6px}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:1px;
  background:var(--line-soft);
  border-left:1px solid var(--line-soft);
  border-right:1px solid var(--line-soft);
  margin:1px 0 0;
}
.card{
  background:var(--bg);
  display:block;width:100%;text-align:left;
  padding:0 0 18px;
  transition:background .3s ease;
}
.card:hover{background:#090909}
.card .thumb{
  aspect-ratio:4/3;background:var(--tile);overflow:hidden;position:relative;
}
.card .thumb img{
  width:100%;height:100%;object-fit:cover;
  filter:grayscale(1) contrast(1.02);
  transform:scale(1.001);
  transition:transform .8s cubic-bezier(.2,.8,.2,1),filter .5s ease;
}
.card:hover .thumb img{transform:scale(1.045);filter:grayscale(0) contrast(1)}
.card .info{padding:14px 16px 0}
.card h3{font-size:.95rem;font-weight:400;margin:0;letter-spacing:.01em}
.card .sub{font-size:11.5px;color:var(--dim);margin-top:5px;letter-spacing:.05em}

/* ---------- post ---------- */
.post{padding-top:clamp(96px,13vh,150px);padding-bottom:70px}
.post-head{
  border-bottom:1px solid var(--line);
  padding-bottom:clamp(20px,3vh,34px);
  margin-bottom:clamp(24px,4vh,46px);
}
.post-head h2{
  font-family:"Syne",sans-serif;font-weight:700;
  font-size:clamp(1.7rem,5.2vw,3.6rem);line-height:1;margin:0;letter-spacing:-.025em;
}
.post-meta{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px 22px;font-size:12px;color:var(--dim);letter-spacing:.05em}
.post-desc{margin:18px 0 0;max-width:68ch;font-size:.95rem;line-height:1.8;color:#c9c9c9}
.post-media{display:grid;gap:clamp(10px,1.6vw,20px);justify-items:center}
.post-media figure{margin:0;width:100%;max-width:1100px}
.post-media img{width:100%;height:auto;background:var(--tile)}
.post-media video{width:100%;height:auto;background:var(--tile)}
.post-foot{
  margin-top:clamp(30px,5vh,56px);padding-top:22px;border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center;justify-content:space-between;
}
.origin{
  font-size:11.5px;letter-spacing:.14em;color:var(--dim);
  border-bottom:1px solid var(--line);padding-bottom:3px;
}
.origin:hover{color:var(--fg);border-color:var(--fg)}
.pager{display:flex;gap:22px;font-size:12.5px;color:var(--dim);letter-spacing:.05em}
.pager button:hover{color:var(--fg)}
.pager button[disabled]{opacity:.25;cursor:default}

.back{
  display:inline-flex;align-items:center;gap:10px;
  font-size:12px;letter-spacing:.12em;color:var(--dim);
  margin-bottom:26px;
}
.back:hover{color:var(--fg)}
.back svg{width:20px;height:9px;transform:rotate(180deg)}

/* placeholder pattern when no image is set yet */
.empty{grid-column:1/-1;background:var(--bg);padding:70px 20px;text-align:center;font-size:13px;color:var(--dim);letter-spacing:.06em}
.ph{
  width:100%;height:100%;min-height:220px;
  background:
    repeating-linear-gradient(135deg,#131313 0 10px,#0b0b0b 10px 20px);
  display:grid;place-items:center;
}
.ph span{font-size:10.5px;letter-spacing:.24em;color:#4a4a4a}

@media (max-width:760px){
  .boxes{grid-template-columns:1fr}
  .box{border-left:1px solid var(--line)!important}
  .strip{width:44%}
  .topnav{gap:18px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<header class="topbar">
  <button class="mark" data-go="#/">HOGGEX</button>
  <nav class="topnav">
    <button data-go="#/art">Art</button>
    <button data-go="#/design">Motion / Design</button>
  </nav>
</header>

<main>
  <!-- HOME -->
  <section class="view" id="view-home">
    <div class="wrap">
      <div class="hero">
        <h1>Portfolio</h1>
        <p class="caption">
          <b>Designer 3D/2D</b> — concept artist and character designer 2D/3D —
          <b>motion graphics and animation</b> 2D/3D. Independent, working with studios
          and brands worldwide.
        </p>
      </div>
    </div>
    <div class="wrap">
      <div class="boxes" id="home-boxes"></div>
    </div>
    <div class="wrap">
      <div class="footer">
        <span>RINE — Hoggex</span>
        <span>Available for freelance and remote work</span>
        <a id="mail" href="mailto:hello@example.com">Get in touch</a>
      </div>
    </div>
  </section>

  <!-- GALLERY -->
  <section class="view" id="view-gallery">
    <div class="wrap">
      <div class="gallery-head">
        <h2 id="gal-title"></h2>
        <span class="meta" id="gal-meta"></span>
      </div>
    </div>
    <div class="wrap">
      <div class="grid" id="gal-grid"></div>
      <div class="footer">
        <button class="back" data-go="#/"><svg viewBox="0 0 24 10" fill="none"><path d="M0 5h22M17 1l5 4-5 4" stroke="currentColor"/></svg> Back to portfolio</button>
        <a class="origin" id="gal-origin" target="_blank" rel="noopener">Open the full profile</a>
      </div>
    </div>
  </section>

  <!-- POST -->
  <section class="view" id="view-post">
    <div class="wrap">
      <div class="post">
        <button class="back" id="post-back"><svg viewBox="0 0 24 10" fill="none"><path d="M0 5h22M17 1l5 4-5 4" stroke="currentColor"/></svg> <span id="post-back-label">Back</span></button>
        <div class="post-head">
          <h2 id="post-title"></h2>
          <div class="post-meta" id="post-meta"></div>
          <p class="post-desc" id="post-desc"></p>
        </div>
        <div class="post-media" id="post-media"></div>
        <div class="post-foot">
          <a class="origin" id="post-origin" target="_blank" rel="noopener">View the original post</a>
          <div class="pager">
            <button id="prev">Previous</button>
            <button id="next">Next</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
/* ==========================================================================
   CONTENT — pulled live from your ArtStation + Behance accounts by /api/feed.
   Nothing to edit here. Post a new project on either platform and it appears
   on this site automatically (the feed is cached for one hour).
   ========================================================================== */
const CONTACT_EMAIL = "hello@example.com";

const WORK = {
  art: {
    label: "Art",
    blurb: "Illustration, creature and character design, concept art and manga pages.",
    profile: "https://www.artstation.com/hoggex",
    profileLabel: "ArtStation",
    posts: []
  },
  design: {
    label: "Motion Graphics / Design",
    blurb: "Motion design, 2D and 3D animation, brand and campaign visuals.",
    profile: "https://www.behance.net/youniszone",
    profileLabel: "Behance",
    posts: []
  }
};

let LOADED = false;

async function loadFeed(){
  try{
    const r = await fetch("/api/feed");
    if(!r.ok) throw new Error(r.status);
    const d = await r.json();
    WORK.art.posts = d.art.posts || [];
    WORK.design.posts = d.design.posts || [];
  }catch(e){
    console.warn("Feed unavailable", e);
  }
  LOADED = true;
  buildHome();
  route();
}

/* ========================================================================== */

const $ = s => document.querySelector(s);
const el = (t, c) => { const n = document.createElement(t); if (c) n.className = c; return n; };

function media(src, alt){
  if(!src){
    const d = el("div","ph");
    const s = el("span"); s.textContent = "Image slot";
    d.appendChild(s); return d;
  }
  if(/\.(mp4|webm|mov)$/i.test(src)){
    const v = document.createElement("video");
    v.src = src; v.controls = true; v.playsInline = true; v.preload = "metadata";
    return v;
  }
  const i = new Image();
  i.src = src; i.alt = alt || ""; i.loading = "lazy";
  i.onerror = () => { const d = el("div","ph"); const s = el("span"); s.textContent="Image slot"; d.appendChild(s); i.replaceWith(d); };
  return i;
}

/* ---------- home ---------- */
function buildHome(){
  const host = $("#home-boxes");
  host.innerHTML = "";
  Object.keys(WORK).forEach((key) => {
    const sec = WORK[key];
    const b = el("button","box");
    b.setAttribute("data-go", "#/" + key);

    const strip = el("div","strip");
    (sec.posts.length ? sec.posts : [{},{},{}]).slice(0,3).forEach(p => {
      const cell = el("div","cell");
      cell.appendChild(media((p.images||[])[0], p.title));
      strip.appendChild(cell);
    });
    b.appendChild(strip);

    const idx = el("div","box-index"); idx.textContent = sec.posts.length
      ? String(sec.posts.length).padStart(2,"0") + " projects"
      : (LOADED ? "" : "Loading…");
    const h = el("h2"); h.textContent = sec.label;
    const p = el("p"); p.textContent = sec.blurb;
    const foot = el("div","box-foot");
    const left = el("span"); left.textContent = sec.profileLabel;
    const enter = el("span","enter");
    enter.innerHTML = 'Enter <svg viewBox="0 0 24 10" fill="none"><path d="M0 5h22M17 1l5 4-5 4" stroke="currentColor"/></svg>';
    foot.append(left, enter);

    b.append(idx, h, p, foot);
    host.appendChild(b);
  });
  $("#mail").href = "mailto:" + CONTACT_EMAIL;
}

/* ---------- gallery ---------- */
function buildGallery(key){
  const sec = WORK[key]; if(!sec) return route("#/");
  $("#gal-title").textContent = sec.label;
  $("#gal-meta").textContent = sec.blurb;
  const origin = $("#gal-origin");
  origin.href = sec.profile;
  origin.textContent = "Open the full " + sec.profileLabel + " profile";

  const grid = $("#gal-grid"); grid.innerHTML = "";
  if(!sec.posts.length){
    const e = el("div","empty");
    e.textContent = LOADED
      ? "Nothing to show from " + sec.profileLabel + " right now."
      : "Loading work from " + sec.profileLabel + "…";
    grid.appendChild(e);
    return;
  }
  sec.posts.forEach(p => {
    const c = el("button","card");
    c.setAttribute("data-go", "#/" + key + "/" + p.id);
    const t = el("div","thumb"); t.appendChild(media((p.images||[])[0], p.title));
    const info = el("div","info");
    const h = el("h3"); h.textContent = p.title;
    const s = el("div","sub"); s.textContent = [p.tags, p.year].filter(Boolean).join("  /  ");
    info.append(h,s); c.append(t,info);
    grid.appendChild(c);
  });
}

/* ---------- post ---------- */
function buildPost(key,id){
  const sec = WORK[key]; if(!sec) return route("#/");
  const i = sec.posts.findIndex(p => p.id === id);
  if(i < 0) return route("#/" + key);
  const p = sec.posts[i];

  $("#post-title").textContent = p.title;
  $("#post-back-label").textContent = "Back to " + sec.label;
  $("#post-back").onclick = () => route("#/" + key);

  const meta = $("#post-meta"); meta.innerHTML = "";
  [p.tags, p.year].filter(Boolean).forEach(x => { const s = el("span"); s.textContent = x; meta.appendChild(s); });

  const desc = $("#post-desc");
  desc.textContent = p.desc || "";
  desc.style.display = p.desc ? "" : "none";

  const m = $("#post-media"); m.innerHTML = "";
  const list = (p.images && p.images.length) ? p.images : [null];
  list.forEach(src => { const f = el("figure"); f.appendChild(media(src, p.title)); m.appendChild(f); });

  const o = $("#post-origin");
  o.href = p.link || sec.profile;
  o.textContent = "View the original post on " + sec.profileLabel;

  const prev = $("#prev"), next = $("#next");
  prev.disabled = i === 0; next.disabled = i === sec.posts.length - 1;
  prev.onclick = () => route("#/" + key + "/" + sec.posts[i-1].id);
  next.onclick = () => route("#/" + key + "/" + sec.posts[i+1].id);
}

/* ---------- router ---------- */
function show(id){
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("is-active", v.id === id));
  window.scrollTo(0,0);
}
function route(hash){
  if(hash && location.hash !== hash){ location.hash = hash; return; }
  const parts = (location.hash || "#/").replace(/^#\/?/,"").split("/").filter(Boolean);
  const [key, id] = parts;
  document.querySelectorAll(".topnav button").forEach(b =>
    b.setAttribute("aria-current", b.dataset.go === "#/" + key ? "true" : "false"));
  if(!key){ show("view-home"); }
  else if(id){ buildPost(key,id); show("view-post"); }
  else { buildGallery(key); show("view-gallery"); }
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-go]");
  if(t){ e.preventDefault(); route(t.dataset.go); }
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && location.hash && location.hash !== "#/"){
    const parts = location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
    route(parts.length > 1 ? "#/" + parts[0] : "#/");
  }
});
window.addEventListener("hashchange", () => route());

buildHome();
route();
loadFeed();
</script>
</body>
</html>
